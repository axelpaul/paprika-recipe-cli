name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check, build and test
        run: npm run check

      - name: Committed dist is up to date
        run: git diff --exit-code -- dist || (echo "dist/ is stale: run npm run build and commit it" && exit 1)

      - name: Verify CLI runs
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js --help | grep -q "serve"
