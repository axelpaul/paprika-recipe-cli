name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Compile binaries
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""
            if [ "${target%%-*}" = "windows" ]; then ext=".exe"; fi
            bun build --compile --minify --external sharp --target="bun-${target}" src/cli.ts --outfile "release/paprika-${target}${ext}"
          done
          cd release
          sha256sum paprika-* > SHA256SUMS
          ls -la

      - name: Smoke test linux binary
        run: |
          ./release/paprika-linux-x64 --version
          ./release/paprika-linux-x64 --help | grep -q serve

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/paprika-*
            release/SHA256SUMS
          generate_release_notes: true
